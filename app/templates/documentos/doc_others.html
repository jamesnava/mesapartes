{%extends "/start/main.html"%}
{%block info%}
<input id="usuario_id" type="hidden" value="{{info.dni}}"/>
<input id="oficina" type="hidden" value="{{info.oficina}}"/>
<h6>
    Usuario:
</h6>
<span>
    {{info.usuario}}
</span>
{%endblock%}
{%block content%}
<div>
    <div class="titulomodulo" style="gap: 10px;">
        <label>
            Buscar
        </label>
        <input id="txtbuscardocumento" name="" type="text"/>
        <label>
            desde
        </label>
        <input name="" type="date"/>
        <label>
            hasta
        </label>
        <input name="" type="date"/>
        <div class="form-check">
            <input class="form-check-input" id="Danulado" name="Dfilter" type="radio" value="ANULADO"/>
            <label class="form-check-label" for="Danulado">
                Anulados
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" id="Darchivado" name="Dfilter" type="radio" value="ARCHIVADO"/>
            <label class="form-check-label" for="Darchivado">
                Archivados
            </label>
        </div>
        <button class="btn btn-success">
            <i aria-hidden="true" class="fas fa-search" title="Buscar">
            </i>
        </button>
        <button class="btn btn-warning">
            <i aria-hidden="true" class="fas fa-file-excel" title="Exportar">
            </i>
        </button>
    </div>
    <div class="contenedorgeneralHistorial">
        <div class="card mt-4 shadow">
            <div class="card-header bg-primary text-white contenedordocumento">
                <h5 class="mb-0">
                    Historial de Documento
                </h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-bordered align-middle mb-0">
                        <thead class="table-light text-center">
                            <tr>
                                <th style="width:20%;">
                                    Titulo
                                </th>
                                <th>
                                    Fecha
                                </th>
                                <th>
                                    Usuario
                                </th>
                                <th>
                                    cod. Seguimiento
                                </th>
                                <th>
                                    Detalles
                                </th>
                            </tr>
                        </thead>
                        <tbody class="text-center" id="tablehistoricoD">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{%endblock%}
