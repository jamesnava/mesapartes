{%extends "/start/main.html"%}
{%block info%}
<input type="hidden" id="usuario_id" value="{{info.dni}}">
<input type="hidden" id="oficina" value="{{info.oficina}}">  
  <h6>Usuario: </h6>
  <span>{{info.usuario}}</span>
{%endblock%}

{%block content%}
<div>
  <div class="titulomodulo">
  <form id="formSeguimiento" class="mb-4">
  <div class="form-group">    
    <input type="text" id="codigoSeguimiento" class="form-control" placeholder="Ingrese código de seguimiento" required>
  </div>
  <button type="button" id="btnconsultar" class="btn btn-primary mt-2">Consultar</button>
</form>
</div>
<div class="contenedorgeneralHistorial">

<!-- Tabla de Historial -->
<div id="resultadoSeguimiento" class="mt-4" style="display: none;">
  <h5>Historial del Documento</h5>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Acción</th>
        <th>Oficina Origen</th>
        <th>Oficina Destino</th>
        <th>Usuario</th>
        <th>Comentario</th>
      </tr>
    </thead>
    <tbody id="historialTabla">
      <!-- Datos se llenan con JavaScript -->
    </tbody>
  </table>
</div>

<!-- Línea de tiempo -->
<div id="lineaTiempo" class="mt-5" style="display: none;">
  <h5>Seguimiento Visual</h5>
  <ul class="timeline">
    <!-- Eventos de línea de tiempo -->
  </ul>
</div>
</div>
</div>
{%endblock%}
