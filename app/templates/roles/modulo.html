{%extends "roles/menuroles.html"%}

{%block content%}
<div >
  <div class="titulomodulo">
   <h1>Modulos</h1>
 </div>
 <div class="contenedorgeneralH">
  <div class="row">
    <div class="col-4"></div>
    <div class="col-4"> <div class="submenubutton" data-bs-toggle="modal" data-bs-target="#AgregarModulos">Agregar</div></div>
    <div class="col-4"></div>
  </div> 

</div>

<div class="contenedorgeneralB">
  <div class="row">
    <div class="col-4"></div>
    <div class="col-4">
      <table class="table table-dark">
        <thead>
          <tr>
            
            <th scope="col">Nro</th>
            <th scope="col">Denominacion</th>
            <th scope="col">Acciones</th>

          </tr>
        </thead>
        <tbody>
          {%for val in datos%}
          <tr>
            <th scope="row">{{val.Id_Permiso}}</th>
            <td>{{val.Nombre_Permiso}}</td>
            <td><button class=" btn btn-primary">Editar</button> </td>            
          </tr>
          {%endfor%}        
        </tbody>
      </table>
    </div>
    <div class="col-4"></div>
  </div>
</div>
</div>





<!-- Modal -->
<div class="modal fade" id="AgregarModulos" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Ingresar datos</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <label>Denominacion</label>
        <input class="form-control" type="input" id="txtMdenominacion">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="rolguardar">Guardar Cambios</button>
      </div>
    </div>
  </div>
</div>
{%endblock%}
